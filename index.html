      app.sandbox.midtrans.com -> app.midtrans.com kalau sudah production.

      type="text/javascript"
      src="https://app.sandbox.midtrans.com/snap/snap.js"
      data-client-key="SB-Mid-client-gAm8oXUyihl8XTj-"
    ></script>
